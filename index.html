:root {
  --marigold: #f2c14e;
  --marigold-deep: #e3a92f;
  --cloth: #2e5e8c;
  --cloth-deep: #1f4468;
  --tomato: #e9573f;
  --leaf: #7cb26a;
  --leaf-deep: #3d7a35;
  --page: #fffdf8;
  --page-edge: #ece5d6;
  --ink: #263042;
  --ink-soft: #55607a;
  --kiku: #f2b000;
  --rose: #d9667a;
  --wood: #b9773f;
  --wood-light: #d39457;
  --wood-deep: #8a5228;
  --wood-back: #6e4323;
  --shadow: rgba(80, 50, 10, .45);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --step: clamp(10px, 1.6vmin, 20px);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  color: var(--ink);
  font-family: "ZhuyinKai", "BiauKai", "DFKai-SB", "Kaiti TC", serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  /* 和繪本蝴蝶頁同一張菊黃小菊花底 */
  background-color: var(--marigold);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='%23e3a92f'><g transform='translate(30 30)'><ellipse rx='4' ry='11'/><ellipse rx='4' ry='11' transform='rotate(45)'/><ellipse rx='4' ry='11' transform='rotate(90)'/><ellipse rx='4' ry='11' transform='rotate(135)'/></g><g transform='translate(90 90) scale(.7)'><ellipse rx='4' ry='11'/><ellipse rx='4' ry='11' transform='rotate(45)'/><ellipse rx='4' ry='11' transform='rotate(90)'/><ellipse rx='4' ry='11' transform='rotate(135)'/></g></g><g fill='%23f6d27a'><circle cx='30' cy='30' r='4'/><circle cx='90' cy='90' r='3'/></g></svg>");
  background-size: 120px 120px;
}
:focus-visible { outline: 4px solid var(--cloth-deep); outline-offset: 6px; border-radius: 6px; }
.w { white-space: nowrap; }

.room {
  height: 100%;
  overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
  gap: var(--step);
  padding: calc(var(--step) * 1.6) calc(var(--step) * 1.6) calc(var(--step) * 2);
}
.room h1 {
  flex: 0 0 auto;
  margin: 0;
  font-weight: normal;
  font-size: clamp(34px, 6vmin, 68px);
  line-height: 1.2;
  letter-spacing: .06em;
  padding: .1em .9em .15em;
  background: var(--page);
  border-radius: 14px;
  box-shadow: 0 10px 18px -12px var(--shadow), inset 0 0 0 3px var(--page-edge);
}

/* ---------- 書櫃 ---------- */
.case {
  flex: 0 0 auto; /* 層數與每層高度由下方 layout() 依螢幕和書的數量算出 */
  width: min(100%, 1180px);
  display: grid;
  gap: clamp(14px, 2.2vmin, 24px);
  padding: clamp(14px, 2.2vmin, 24px);
  border-radius: 10px 10px 4px 4px;
  /* 木紋：直向細紋疊在木色上 */
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .05) 0 3px, transparent 3px 11px, rgba(90, 45, 10, .06) 11px 13px, transparent 13px 29px),
    linear-gradient(var(--wood-light), var(--wood));
  box-shadow: 0 34px 44px -26px rgba(60, 35, 5, .7), inset 0 0 0 2px rgba(255, 255, 255, .12), inset 0 -6px 0 var(--wood-deep);
}
.shelf {
  position: relative; min-height: 0;
  container-type: size;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 1.6cqh;
  padding: 0 4cqh 7cqh;
  border-radius: 4px;
  /* 櫃子裡面比較暗，上緣有層板投下的陰影 */
  background:
    linear-gradient(rgba(30, 15, 5, .45), transparent 22%),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .05) 0 2px, transparent 2px 17px),
    var(--wood-back);
  box-shadow: inset 6px 0 10px -6px rgba(20, 10, 0, .6), inset -6px 0 10px -6px rgba(20, 10, 0, .6);
}
/* 層板 */
.shelf::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7cqh; min-height: 12px;
  background: linear-gradient(var(--wood-light), var(--wood) 55%, var(--wood-deep));
  border-radius: 0 0 4px 4px;
  box-shadow: 0 -2px 6px rgba(20, 10, 0, .35);
}

/* 裝飾用書背 */
.spine {
  position: relative; z-index: 1;
  flex: 0 0 auto;
  width: var(--w, 9cqh); height: var(--h, 70cqh);
  border-radius: 3px 3px 1px 1px;
  background: var(--c, var(--leaf));
  box-shadow: inset 3px 0 0 rgba(255, 255, 255, .18), inset -4px 0 0 rgba(0, 0, 0, .18), 0 0 0 1px rgba(30, 15, 5, .25);
  transform: rotate(var(--r, 0deg)); transform-origin: bottom right;
}
.spine::before, .spine::after { content: ""; position: absolute; left: 18%; right: 18%; height: 3px; border-radius: 2px; background: rgba(255, 253, 248, .55); }
.spine::before { top: 12%; }
.spine::after { bottom: 12%; }

/* ---------- 封面朝外的繪本 ---------- */
.book {
  position: relative; z-index: 2;
  flex: 0 0 auto;
  height: min(90cqh, 112cqw); aspect-ratio: 3 / 4; min-width: 0; /* 窄螢幕時寬度最多約八成五 */
  container-type: size; /* 書內的 cqw 以書寬計算 */
  margin: 0 3cqh;
  display: block;
  color: inherit; text-decoration: none;
  transform-origin: bottom center;
  transition: transform .45s var(--ease), filter .45s var(--ease);
  filter: drop-shadow(0 10px 10px rgba(20, 10, 0, .45));
}
.book:hover { transform: translateY(-3cqh) rotate(-1.5deg); }
.book:active { transform: translateY(-1.5cqh) scale(.98); }
.book.opening { transform: translateY(-6cqh) scale(1.08); transition-duration: .4s; }
.book .board {
  position: absolute; inset: 0;
  container-type: size;
  border-radius: 3px 8px 8px 3px;
  padding: 7cqw 7cqw 7cqw 11cqw;
  /* 布面：深淺交織的細格紋 */
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .07) 0 1px, transparent 1px 3px),
    var(--cover, var(--cloth));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), inset 0 0 14px rgba(10, 30, 55, .45);
}
/* 書背折痕 */
.book .board::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 5cqw; width: 2.4cqw;
  background: linear-gradient(90deg, rgba(0, 0, 0, .28), rgba(255, 255, 255, .12) 60%, transparent);
}
/* 書口露出的紙頁 */
.book::after {
  content: ""; position: absolute; top: 2.5%; bottom: 1.5%; right: -1.6%; width: 2.4%; z-index: -1;
  border-radius: 0 3px 3px 0;
  background: repeating-linear-gradient(90deg, var(--page) 0 1px, var(--page-edge) 1px 2px);
}
.book .label {
  height: 100%;
  display: flex; flex-direction: column; align-items: center;
  border-radius: 4px;
  background: var(--page);
  box-shadow: 0 0 0 1cqw var(--accent, var(--marigold)), inset 0 0 0 1px rgba(80, 55, 20, .12);
  padding: 6cqw 5cqw 4cqw;
  overflow: hidden;
}
.book .ttl {
  font-size: 17cqw; line-height: 1.1; text-align: center; white-space: nowrap;
}
.book .ttl .sub { display: block; font-size: .62em; color: var(--cover, var(--cloth)); margin-top: .15em; }
.book img {
  flex: 1 1 0; min-height: 0; width: 100%;
  object-fit: contain;
  -webkit-user-drag: none;
}

/* 菊花盆栽（裝飾） */
.pot { flex: 0 0 auto; height: 78cqh; width: 62cqh; margin-left: 4cqh; position: relative; z-index: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="room">
  <h1><span class="w">節日</span><span class="w">繪本</span></h1>

  <!--
    書單：照順序排上書架，層數、每層幾本、裝飾書背都會自動安排。
    加一本新書 → 複製下面一整個 <a class="book"> … </a>，改：
      href          繪本網頁（每個節日一個資料夾，例如 中秋節/index.html）
      aria-label    念給螢幕報讀的書名
      --cover       封面布的顏色；--accent 內頁框線的顏色（可省略）
      .ttl / .sub   封面主標題、副標題（多音字照樣用「字[注音]」標記）
      img src       封面插圖（放在該節日的資料夾裡）
  -->
  <main class="case">
    <a class="book" href="重陽節/index.html" aria-label="打開重󠇡陽節繪本：重󠇡陽節登高去" style="--cover:#2e5e8c; --accent:#f2c14e">
      <span class="board">
        <span class="label">
          <span class="ttl"><span class="w">重󠇡陽節</span><span class="sub"><span class="w">登高</span>去！</span></span>
          <img src="重陽節/茱萸.png" alt="" draggable="false">
        </span>
      </span>
    </a>
  </main>
</div>

<!-- 菊花盆栽（裝飾），排版時放在最後一層的右邊 -->
<template id="pot">
  <svg class="pot" viewBox="0 0 80 100" aria-hidden="true">
    <path d="M40 62 C 38 50, 30 44, 22 40 M40 62 C 42 48, 50 42, 58 38 M40 62 V 40" fill="none" stroke="#3d7a35" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="30" cy="50" rx="7" ry="3.5" fill="#7cb26a" transform="rotate(-30 30 50)"/>
    <ellipse cx="52" cy="48" rx="7" ry="3.5" fill="#7cb26a" transform="rotate(30 52 48)"/>
    <g fill="#f2b000"><g transform="translate(22 36)"><ellipse rx="3" ry="9"/><ellipse rx="3" ry="9" transform="rotate(45)"/><ellipse rx="3" ry="9" transform="rotate(90)"/><ellipse rx="3" ry="9" transform="rotate(135)"/></g>
      <g transform="translate(58 34)"><ellipse rx="3" ry="9"/><ellipse rx="3" ry="9" transform="rotate(45)"/><ellipse rx="3" ry="9" transform="rotate(90)"/><ellipse rx="3" ry="9" transform="rotate(135)"/></g>
      <g transform="translate(40 26) scale(1.15)"><ellipse rx="3" ry="9"/><ellipse rx="3" ry="9" transform="rotate(45)"/><ellipse rx="3" ry="9" transform="rotate(90)"/><ellipse rx="3" ry="9" transform="rotate(135)"/></g></g>
    <g fill="#9a5b00"><circle cx="22" cy="36" r="3"/><circle cx="58" cy="34" r="3"/><circle cx="40" cy="26" r="3.4"/></g>
    <path d="M18 62 H62 L56 98 H24Z" fill="#e9573f"/>
    <path d="M14 60 H66 V68 H14Z" fill="#b8402c"/>
  </svg>
</template>

<script>
(function () {
  "use strict";
  var room = document.querySelector(".room");
  var title = room.querySelector("h1");
  var shelfCase = document.querySelector(".case");
  var books = Array.prototype.slice.call(shelfCase.querySelectorAll(".book"));
  var potTpl = document.getElementById("pot");

  /* ---- 自動排書架 ----
     以下比例都是「層高的幾分之幾」，對應 CSS 的 cqh：
     書高 90、寬 = 高 × 3/4、左右外距各 3；層內左右留白各 4；間距 1.6；書背平均約 11 寬；盆栽 62 寬加外距 4 */
  var BOOK = 0.9 * 0.75 + 0.06 + 0.016;
  var SPINE = 0.11 + 0.016;
  var PAD = 0.08;
  var POT = 0.62 + 0.04 + 0.016;
  var MIN_H = 170;          /* 一層最矮幾 px，再矮就固定這個高度、改成往下捲 */
  var HERO = 3 / 4.4;       /* 書都放得進一層時，上層占的比例（下層只擺裝飾） */
  var COLORS = ["#7cb26a", "#d9667a", "#f2b000", "#e9573f", "#fffdf8", "#3d7a35", "#2e5e8c", "#f2c14e"];

  function fit(h, w) { return Math.max(1, Math.floor((w - PAD * h - 2 * SPINE * h) / (BOOK * h))); }
  function num(v) { return parseFloat(v) || 0; }
  /* 固定的亂數：同一個位置每次都長一樣，視窗縮放時書背不會亂換 */
  function rnd(a, b) { var x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); }

  function spine(row, k, tilt) {
    var el = document.createElement("span");
    el.className = "spine";
    el.setAttribute("aria-hidden", "true");
    el.style.setProperty("--c", COLORS[Math.floor(rnd(row, k) * COLORS.length)]);
    el.style.setProperty("--h", (62 + Math.round(rnd(row, k + 50) * 18)) + "cqh");
    el.style.setProperty("--w", (8 + Math.round(rnd(row, k + 90) * 4)) + "cqh");
    if (tilt) el.style.setProperty("--r", "-9deg");
    return el;
  }

  function layout() {
    var rs = getComputedStyle(room), cs = getComputedStyle(shelfCase);
    var gap = num(cs.rowGap);
    var W = shelfCase.clientWidth - num(cs.paddingLeft) - num(cs.paddingRight);
    var H = room.clientHeight - num(rs.paddingTop) - num(rs.paddingBottom) - title.offsetHeight - num(rs.rowGap)
      - num(cs.paddingTop) - num(cs.paddingBottom);
    var n = books.length, rows = [], heights = [], r, h, i;

    var hTop = (H - gap) * HERO;
    if (n <= fit(hTop, W) && hTop >= MIN_H) {
      /* 書不多：上層大大的放書，下層擺裝飾 */
      rows = [books, []];
      heights = [hTop, H - gap - hTop];
    } else {
      /* 書多：一層一層加，直到放得下；太矮就固定最矮高度、往下捲 */
      for (r = 2; ; r++) {
        h = (H - gap * (r - 1)) / r;
        if (h < MIN_H) { h = MIN_H; r = Math.max(2, Math.ceil(n / fit(h, W))); break; }
        if (r * fit(h, W) >= n) break;
      }
      var per = Math.ceil(n / r);
      for (i = 0; i < r; i++) { rows.push(books.slice(i * per, (i + 1) * per)); heights.push(h); }
    }

    shelfCase.textContent = "";
    shelfCase.style.gridTemplateRows = heights.map(function (x) { return Math.floor(x) + "px"; }).join(" ");
    rows.forEach(function (list, row) {
      var h = heights[row];
      var shelf = document.createElement("div");
      shelf.className = "shelf";
      var space = W - PAD * h - list.length * BOOK * h;
      var pot = row === rows.length - 1 && space >= POT * h + 2 * SPINE * h;
      if (pot) space -= POT * h;
      var count = Math.max(0, Math.min(list.length ? 6 : 4, Math.floor(space / (SPINE * h * 1.1))));
      var left = Math.floor(count / 2), k;
      for (k = 0; k < left; k++) shelf.appendChild(spine(row, k, false));
      list.forEach(function (b) { shelf.appendChild(b); });
      for (k = left; k < count; k++) shelf.appendChild(spine(row, k, k === count - 1 && !pot && rnd(row, 7) > .4));
      if (pot) shelf.appendChild(potTpl.content.firstElementChild.cloneNode(true));
      if (!list.length) shelf.setAttribute("aria-hidden", "true");
      shelfCase.appendChild(shelf);
    });
  }

  var queued = false;
  function relayout() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; layout(); });
  }
  layout();
  window.addEventListener("resize", relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout); /* 字型載入後標題高度會變 */

  /* 點書時先把書抽出來一點再開，動畫減量時直接開 */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  books.forEach(function (a) {
    a.addEventListener("click", function (e) {
      if (reduce.matches || e.ctrlKey || e.metaKey || e.shiftKey) return;
      e.preventDefault();
      a.classList.add("opening");
      setTimeout(function () { location.href = a.href; }, 380);
    });
  });
  /* 從繪本按「上一頁」回來時（bfcache），把書放回原位 */
  window.addEventListener("pageshow", function () {
    books.forEach(function (a) { a.classList.remove("opening"); });
  });
})();
</script>
</body>
</html>
